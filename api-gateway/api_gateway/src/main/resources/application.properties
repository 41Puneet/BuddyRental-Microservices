spring.application.name=api-gateway

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka


spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=vehicle-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://VEHICLE-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/vehicles/**

spring.cloud.gateway.server.webmvc.routes[2].id=booking-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/bookings/**


spring.cloud.gateway.server.webmvc.routes[3].id=payment-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/payments/**

eureka.instance.prefer-ip-address=true

jwt.secret=${JWT_SECRET}

# CORS — set ALLOWED_ORIGINS env var for production (e.g. https://yourfrontend.com)
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}

logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=INFO
