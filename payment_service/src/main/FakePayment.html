<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razorpay Test</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

    <h2>BuddyRental Razorpay Test</h2>

    <button id="payBtn">Pay ₹15</button>

    <script>
        document.getElementById("payBtn").onclick = function () {

            const options = {
                key: "rzp_test_T4bfv2KlaVXzzs",
                amount: 1500, // amount in paise
                currency: "INR",
                name: "BuddyRental",
                description: "Vehicle Booking Payment",

                order_id: "order_T5C8eonDUM6nhp",

                handler: function (response) {

                    console.log("Payment Success");
                    console.log(response);

                    alert(
                        "Payment ID: " + response.razorpay_payment_id +
                        "\nOrder ID: " + response.razorpay_order_id +
                        "\nSignature: " + response.razorpay_signature
                    );

                    document.body.innerHTML += `
                        <h3>Payment Successful</h3>
                        <p><b>Payment ID:</b> ${response.razorpay_payment_id}</p>
                        <p><b>Order ID:</b> ${response.razorpay_order_id}</p>
                        <p><b>Signature:</b> ${response.razorpay_signature}</p>
                    `;
                },

                prefill: {
                    name: "Test User",
                    email: "test@example.com",
                    contact: "9999999999"
                },

                theme: {
                    color: "#3399cc"
                }
            };

            const rzp = new Razorpay(options);

            rzp.on("payment.failed", function (response) {
                console.log(response.error);
                alert("Payment Failed");
            });

            rzp.open();
        };
    </script>

</body>
</html>
